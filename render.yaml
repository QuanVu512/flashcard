services:
  - type: web
    name: flashcard
    runtime: docker
    plan: free
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_USERNAME
        sync: false
      - key: DATABASE_PASSWORD
        sync: false
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: SESSION_COOKIE_SECURE
        value: true
      - key: SESSION_COOKIE_SAME_SITE
        value: Lax
      - key: APP_RATE_LIMIT_ENABLED
        value: true
      - key: APP_RATE_LIMIT_API_CAPACITY
        value: 120
      - key: APP_RATE_LIMIT_WINDOW_SECONDS
        value: 60
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_DISPLAY_NAME
        value: Admin
      - key: TRANSLATION_PROVIDER
        value: azure
      - key: TRANSLATION_DEFAULT_TARGET
        value: vi
      - key: AZURE_TRANSLATOR_ENDPOINT
        value: https://api.cognitive.microsofttranslator.com
      - key: AZURE_TRANSLATOR_KEY
        sync: false
      - key: AZURE_TRANSLATOR_REGION
        sync: false
      - key: HANDWRITING_PROVIDER
        value: azure
      - key: AZURE_VISION_KEY
        sync: false
      - key: AZURE_VISION_ENDPOINT
        sync: false
