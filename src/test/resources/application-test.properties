spring.datasource.url=jdbc:h2:mem:flashcard-test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.flyway.enabled=false
spring.jpa.open-in-view=false

app.translation.provider=none
app.handwriting.provider=none
app.auth.mail.enabled=true
app.auth.mail.from=test@flashcard.local
app.auth.mail.worker-delay-ms=10
app.auth.mail.worker-concurrency=1
