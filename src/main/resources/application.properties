spring.application.name=flashcard
spring.config.import=optional:file:.env[.properties]
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
server.port=${PORT:${SERVER_PORT:8000}}

spring.datasource.url=${DATABASE_URL:jdbc:h2:file:./data/flashcard-dev;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE}
spring.datasource.username=${DATABASE_USERNAME:sa}
spring.datasource.password=${DATABASE_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

spring.thymeleaf.cache=false
server.error.whitelabel.enabled=false
server.forward-headers-strategy=framework
server.servlet.session.timeout=${SESSION_TIMEOUT:45m}
server.servlet.session.tracking-modes=cookie
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.cookie.same-site=${SESSION_COOKIE_SAME_SITE:Lax}

app.translation.provider=${TRANSLATION_PROVIDER:none}
app.translation.default-target=${TRANSLATION_DEFAULT_TARGET:vi}
app.translation.azure.key=${AZURE_TRANSLATOR_KEY:}
app.translation.azure.region=${AZURE_TRANSLATOR_REGION:}
app.translation.azure.endpoint=${AZURE_TRANSLATOR_ENDPOINT:https://api.cognitive.microsofttranslator.com}

app.handwriting.provider=${HANDWRITING_PROVIDER:none}
app.handwriting.azure.key=${AZURE_VISION_KEY:}
app.handwriting.azure.endpoint=${AZURE_VISION_ENDPOINT:}

app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}
app.admin.display-name=${ADMIN_DISPLAY_NAME:Admin}

app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:}
app.cors.allowed-origin-patterns=${APP_CORS_ALLOWED_ORIGIN_PATTERNS:}
app.cors.allowed-methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
app.cors.allowed-headers=Content-Type,X-Requested-With,X-Request-Id,Accept,Origin,X-CSRF-TOKEN
app.cors.exposed-headers=X-Request-Id
app.cors.allow-credentials=true
app.cors.max-age=1800

app.rate-limit.enabled=${APP_RATE_LIMIT_ENABLED:true}
app.rate-limit.api-capacity=${APP_RATE_LIMIT_API_CAPACITY:120}
app.rate-limit.window-seconds=${APP_RATE_LIMIT_WINDOW_SECONDS:60}
