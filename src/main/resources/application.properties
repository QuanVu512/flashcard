spring.application.name=flashcard
spring.config.import=optional:file:.env[.properties]
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
server.port=${PORT:${SERVER_PORT:8000}}

spring.datasource.url=${DATABASE_URL:jdbc:h2:file:./data/flashcard-dev;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE}
spring.datasource.username=${DATABASE_USERNAME:sa}
spring.datasource.password=${DATABASE_PASSWORD:}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

server.error.whitelabel.enabled=false
server.forward-headers-strategy=framework

app.translation.provider=${TRANSLATION_PROVIDER:none}
app.translation.default-target=${TRANSLATION_DEFAULT_TARGET:vi}
app.translation.azure.key=${AZURE_TRANSLATOR_KEY:}
app.translation.azure.region=${AZURE_TRANSLATOR_REGION:}
app.translation.azure.endpoint=${AZURE_TRANSLATOR_ENDPOINT:https://api.cognitive.microsofttranslator.com}

app.handwriting.provider=${HANDWRITING_PROVIDER:none}
app.handwriting.azure.key=${AZURE_VISION_KEY:}
app.handwriting.azure.endpoint=${AZURE_VISION_ENDPOINT:}

app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}
app.admin.display-name=${ADMIN_DISPLAY_NAME:Admin}

app.security.jwt.base64-secret=${JWT_BASE64_SECRET:}
app.security.jwt.secret=${JWT_SECRET:dev-only-change-me-dev-only-change-me-32-bytes}

app.auth.session.access-minutes=${AUTH_ACCESS_MINUTES:15}
app.auth.session.password-days=${AUTH_PASSWORD_SESSION_DAYS:3}
app.auth.session.google-days=${AUTH_GOOGLE_SESSION_DAYS:30}
app.auth.session.trusted-device-days=${AUTH_TRUSTED_DEVICE_DAYS:30}

app.auth.otp.expiration-minutes=${AUTH_OTP_EXPIRATION_MINUTES:5}
app.auth.otp.initial-resend-seconds=${AUTH_OTP_INITIAL_RESEND_SECONDS:10}
app.auth.otp.resend-seconds=${AUTH_OTP_RESEND_SECONDS:60}
app.auth.otp.max-attempts=${AUTH_OTP_MAX_ATTEMPTS:5}
app.auth.otp.max-sends=${AUTH_OTP_MAX_SENDS:5}
app.auth.otp.send-window-hours=${AUTH_OTP_SEND_WINDOW_HOURS:6}
app.auth.otp.browser-block-seconds=${AUTH_OTP_BROWSER_BLOCK_SECONDS:120}
app.auth.otp.hash-secret=${AUTH_OTP_HASH_SECRET:dev-only-otp-secret-change-me-32-bytes}

app.auth.mail.enabled=${AUTH_MAIL_ENABLED:false}
app.auth.mail.from=${AUTH_MAIL_FROM:${MAIL_USERNAME:}}
app.auth.mail.worker-delay-ms=${AUTH_MAIL_WORKER_DELAY_MS:500}
app.auth.mail.worker-concurrency=${AUTH_MAIL_WORKER_CONCURRENCY:2}
app.auth.mail.delivery-max-attempts=${AUTH_MAIL_DELIVERY_MAX_ATTEMPTS:3}
app.auth.mail.processing-lease-seconds=${AUTH_MAIL_PROCESSING_LEASE_SECONDS:60}
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS_ENABLE:true}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

app.auth.google.enabled=${GOOGLE_AUTH_ENABLED:false}
app.auth.google.client-id=${GOOGLE_CLIENT_ID:}
app.auth.google.client-secret=${GOOGLE_CLIENT_SECRET:}
app.auth.google.redirect-uri=${GOOGLE_REDIRECT_URI:{baseUrl}/login/oauth2/code/google}
app.auth.google.frontend-base-url=${APP_FRONTEND_BASE_URL:}

app.security.cookie.name=${AUTH_COOKIE_NAME:flashcard_access_token}
app.security.cookie.refresh-name=${AUTH_REFRESH_COOKIE_NAME:flashcard_refresh_token}
app.security.cookie.trusted-device-name=${AUTH_TRUSTED_DEVICE_COOKIE_NAME:flashcard_trusted_device}
app.security.cookie.google-link-name=${AUTH_GOOGLE_LINK_COOKIE_NAME:flashcard_google_link}
app.security.cookie.oauth-return-name=${AUTH_OAUTH_RETURN_COOKIE_NAME:flashcard_oauth_return}
app.security.cookie.same-site=${AUTH_COOKIE_SAME_SITE:Lax}

app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:}
app.cors.allowed-origin-patterns=${APP_CORS_ALLOWED_ORIGIN_PATTERNS:}
app.cors.allowed-methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
app.cors.allowed-headers=Content-Type,Authorization,X-XSRF-TOKEN,X-Requested-With,X-Request-Id,Accept,Origin
app.cors.exposed-headers=X-Request-Id,Retry-After,X-Auth-Action
app.cors.allow-credentials=true
app.cors.max-age=1800

app.rate-limit.enabled=${APP_RATE_LIMIT_ENABLED:true}
app.rate-limit.api-capacity=${APP_RATE_LIMIT_API_CAPACITY:120}
app.rate-limit.window-seconds=${APP_RATE_LIMIT_WINDOW_SECONDS:60}
