<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="'Setup Test | ' + ${set.title}">Setup Test | Flashcard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{/css/app.css}" rel="stylesheet">
</head>
<body class="app-body">
<div class="app-shell">
    <div th:replace="~{fragments/shell :: sidebar('library')}"></div>
    <div class="workspace">
        <div th:replace="~{fragments/shell :: topbar}"></div>

        <main class="content study-content">
            <div class="content-heading compact-heading">
                <div>
                    <a class="back-link" th:href="@{/sets/{id}(id=${set.id})}">
                        <i class="bi bi-arrow-left"></i>
                        Flashcards
                    </a>
                    <h1>Thiết lập bài test</h1>
                    <p th:text="${set.folder != null ? 'Bài test sẽ lấy câu hỏi trong thư mục này.' : 'Bài test sẽ lấy câu hỏi trong bộ hiện tại.'}">
                        Bài test sẽ lấy câu hỏi trong bộ hiện tại.
                    </p>
                </div>
            </div>

            <nav class="study-mode-tabs" aria-label="Chế độ học">
                <a th:href="@{/sets/{id}(id=${set.id})}">
                    <i class="bi bi-stickies-fill"></i>
                    Flashcards
                </a>
                <a th:href="@{/sets/{id}/learn(id=${set.id})}">
                    <i class="bi bi-record-circle"></i>
                    Learn
                </a>
                <a class="active" th:href="@{/sets/{id}/test/setup(id=${set.id})}">
                    <i class="bi bi-clipboard-check-fill"></i>
                    Test
                </a>
                <a th:href="@{/sets/{id}/flip(id=${set.id})}">
                    <i class="bi bi-grid-3x3-gap-fill"></i>
                    Lật thẻ
                </a>
            </nav>

            <section class="test-setup-card">
                <form th:action="@{/sets/{id}/test(id=${set.id})}" method="get">
                    <div class="setup-grid">
                        <label>
                            <span>Số câu hỏi</span>
                            <input class="form-control" type="number" name="questionCount" min="1"
                                   th:max="${maxQuestions}" th:value="${defaultQuestions}" required>
                            <small th:text="|Tối đa ${maxQuestions} câu|">Tối đa 10 câu</small>
                        </label>
                        <label>
                            <span>Thời gian làm bài</span>
                            <input class="form-control" type="number" name="minutes" min="1" max="180"
                                   th:value="${defaultMinutes}" required>
                            <small>Đơn vị: phút</small>
                        </label>
                        <label>
                            <span>Kiểu ôn tập</span>
                            <select class="form-select" name="testMode">
                                <option th:value="${meaningMode}" th:selected="${testMode == meaningMode}">
                                    Ôn tập nghĩa
                                </option>
                                <option th:value="${termMode}" th:selected="${testMode == termMode}">
                                    Ôn tập từ
                                </option>
                            </select>
                            <small>Chọn hướng câu hỏi cho bài test</small>
                        </label>
                    </div>
                    <div class="setup-actions">
                        <a class="btn btn-light" th:href="@{/sets/{id}(id=${set.id})}">Hủy</a>
                        <button class="btn btn-primary" type="submit" th:disabled="${maxQuestions == 0}">
                            Bắt đầu test
                        </button>
                    </div>
                </form>
            </section>
        </main>
    </div>
</div>

<div th:replace="~{fragments/shell :: folderModal}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
