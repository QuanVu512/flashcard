<main class="auth-wrap">
    <section class="auth-panel">
        <a class="auth-logo" href="/login" data-nav="/login" aria-label="Flashcard">F</a>
        <h1>Liên kết Google</h1>
        <form class="auth-form" data-auth-form="google-link" novalidate>
            <label class="form-label" for="linkPassword">Mật khẩu tài khoản hiện tại</label>
            <input id="linkPassword" class="form-control" name="password" type="password"
                   autocomplete="current-password" required autofocus>
            <div class="field-error" data-form-error hidden></div>
            <button class="btn btn-primary" type="submit">Xác nhận liên kết</button>
        </form>
        <div class="auth-switch"><a href="/login" data-nav="/login">Dùng cách đăng nhập khác</a></div>
    </section>
</main>
