<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Đăng nhập | Flashcard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{/css/app.css}" rel="stylesheet">
</head>
<body class="auth-body">
<main class="auth-wrap">
    <section class="auth-panel">
        <a class="auth-logo" th:href="@{/login}">F</a>
        <h1>Chào mừng trở lại</h1>
        <p>Tiếp tục học bộ từ vựng của bạn.</p>

        <div class="alert alert-success" th:if="${registered}">Đăng ký thành công, bạn có thể đăng nhập.</div>
        <div class="alert alert-danger" th:if="${param.error}">Email hoặc mật khẩu chưa đúng.</div>
        <div class="alert alert-warning" th:if="${param.expired}">Phiên đăng nhập đã hết hạn, vui lòng đăng nhập lại.</div>
        <div class="alert alert-info" th:if="${param.logout}">Bạn đã đăng xuất.</div>

        <form th:action="@{/login}" method="post" class="auth-form">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <label class="form-label" for="username">Email</label>
            <input class="form-control" id="username" name="username" type="email"
                   autocomplete="email" placeholder="example@gmail.com" required>

            <label class="form-label" for="password">Mật khẩu</label>
            <input class="form-control" id="password" name="password" type="password"
                   autocomplete="current-password" placeholder="example1@-.*" required>

            <button class="btn btn-primary w-100" type="submit">Đăng nhập</button>
        </form>

        <div class="auth-switch">
            Chưa có tài khoản?
            <a th:href="@{/register}">Đăng ký</a>
        </div>
    </section>
</main>
</body>
</html>
