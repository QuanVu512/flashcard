<main class="auth-wrap">
    <section class="auth-panel">
        <a class="auth-logo" href="/login" data-nav="/login" aria-label="Flashcard">F</a>
        <h1>Đăng nhập</h1>
        <p>Tiếp tục học từ vựng của bạn.</p>
        <a class="btn btn-google" href="/api/auth/google/start" data-google-login>
            <span class="google-mark" aria-hidden="true">G</span>
            Tiếp tục với Google
        </a>
        <div class="auth-divider"><span>hoặc dùng mật khẩu</span></div>
        <form class="auth-form" data-auth-form="login" novalidate>
            <label class="form-label" for="email">Email</label>
            <input id="email" class="form-control" name="email" type="email" placeholder="example@gmail.com" autocomplete="email" required>
            <label class="form-label" for="password">Mật khẩu</label>
            <input id="password" class="form-control" name="password" type="password" placeholder="example1@-.*" autocomplete="current-password" required>
            <div class="field-error" data-form-error hidden></div>
            <button class="btn btn-primary auth-submit" type="submit">
                <span class="auth-submit-spinner" data-submit-spinner aria-hidden="true" hidden></span>
                <span data-submit-label>Đăng nhập</span>
            </button>
            <div class="auth-progress" data-login-progress role="status" aria-live="polite" hidden>
                <span class="auth-progress-track" aria-hidden="true">
                    <span class="auth-progress-bar"></span>
                </span>
                <span>Đang xử lý...</span>
            </div>
        </form>
        <div class="auth-switch">Chưa có tài khoản? <a href="/register" data-nav="/register">Đăng ký</a></div>
    </section>
</main>
