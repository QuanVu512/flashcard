<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Đăng ký | Flashcard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{/css/app.css}" rel="stylesheet">
</head>
<body class="auth-body">
<main class="auth-wrap">
    <section class="auth-panel">
        <a class="auth-logo" th:href="@{/login}">F</a>
        <h1>Tạo tài khoản</h1>
        <p>Lưu thư mục và bộ flashcard riêng của bạn.</p>

        <form th:action="@{/register}" th:object="${registerRequest}" method="post" class="auth-form">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

            <label class="form-label" for="displayName">Tên hiển thị</label>
            <input class="form-control" id="displayName" th:field="*{displayName}"
                   autocomplete="name" placeholder="Nhập tên hiển thị" required>
            <div class="field-error" th:if="${#fields.hasErrors('displayName')}" th:errors="*{displayName}"></div>

            <label class="form-label" for="email">Email</label>
            <input class="form-control" id="email" th:field="*{email}" type="email"
                   autocomplete="email" placeholder="example@gmail.com" required>
            <div class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>

            <label class="form-label" for="password">Mật khẩu</label>
            <input class="form-control" id="password" th:field="*{password}" type="password"
                   autocomplete="new-password" placeholder="example1@-.*" required>
            <div class="field-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>

            <label class="form-label" for="confirmPassword">Nhập lại mật khẩu</label>
            <input class="form-control" id="confirmPassword" th:field="*{confirmPassword}" type="password"
                   autocomplete="new-password" placeholder="example1@-.*" required>
            <div class="field-error" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></div>

            <button class="btn btn-primary w-100" type="submit">Đăng ký</button>
        </form>

        <div class="auth-switch">
            Đã có tài khoản?
            <a th:href="@{/login}">Đăng nhập</a>
        </div>
    </section>
</main>
</body>
</html>
