<main class="auth-wrap">
    <section class="auth-panel">
        <a class="auth-logo" href="/login" data-nav="/login" aria-label="Flashcard">F</a>
        <h1>Tạo tài khoản</h1>
        <p>Tạo thư viện flashcard cá nhân.</p>
        <form class="auth-form" data-auth-form="register" novalidate>
            <label class="form-label" for="displayName">Tên hiển thị</label>
            <input id="displayName" class="form-control" name="displayName" placeholder="Nguyễn Văn A" autocomplete="name" required>
            <label class="form-label" for="email">Email</label>
            <input id="email" class="form-control" name="email" type="email" placeholder="example@gmail.com" autocomplete="email" required>
            <label class="form-label" for="password">Mật khẩu</label>
            <input id="password" class="form-control" name="password" type="password" placeholder="example1@-.*" autocomplete="new-password" required>
            <label class="form-label" for="confirmPassword">Xác nhận mật khẩu</label>
            <input id="confirmPassword" class="form-control" name="confirmPassword" type="password" placeholder="example1@-.*" autocomplete="new-password" required>
            <div class="field-error" data-form-error hidden></div>
            <button class="btn btn-primary" type="submit">Đăng ký</button>
        </form>
        <div class="auth-switch">Đã có tài khoản? <a href="/login" data-nav="/login">Đăng nhập</a></div>
    </section>
</main>
