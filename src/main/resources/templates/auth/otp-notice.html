<dialog class="otp-notice" data-otp-notice aria-labelledby="otpNoticeTitle" aria-describedby="otpNoticeMessage">
    <div class="otp-notice__content">
        <span class="otp-notice__icon" aria-hidden="true">
            <i class="bi bi-envelope-check"></i>
        </span>
        <h2 id="otpNoticeTitle">Kiểm tra email của bạn</h2>
        <p id="otpNoticeMessage">
            Mã OTP đã được gửi đến email của bạn. Vui lòng kiểm tra hộp thư đến và thư rác.
        </p>
        <button class="btn btn-primary otp-notice__confirm" type="button" data-otp-notice-confirm>OK</button>
    </div>
</dialog>
