<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${managedUser.displayName} + ' | Quản trị'">Người dùng | Quản trị</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{/css/app.css}" rel="stylesheet">
</head>
<body class="app-body">
<div class="app-shell">
    <div th:replace="~{fragments/shell :: sidebar('admin')}"></div>
    <div class="workspace">
        <div th:replace="~{fragments/shell :: topbar}"></div>

        <main class="content admin-content">
            <div class="content-heading compact-heading">
                <div>
                    <a class="back-link" th:href="@{/admin}">
                        <i class="bi bi-arrow-left"></i>
                        Quản trị
                    </a>
                    <h1 th:text="${managedUser.displayName}">Người dùng</h1>
                    <p th:text="${managedUser.email}">example@gmail.com</p>
                </div>
            </div>

            <div class="alert alert-success" th:if="${adminMessage}" th:text="${adminMessage}"></div>
            <div class="alert alert-danger" th:if="${adminError}" th:text="${adminError}"></div>

            <section class="admin-detail-layout">
                <div class="admin-panel">
                    <div class="admin-panel-head">
                        <h2>Thông tin tài khoản</h2>
                        <span class="admin-status" th:classappend="${managedUser.enabled()} ? ' is-active' : ' is-locked'"
                              th:text="${managedUser.enabled()} ? 'Đang hoạt động' : 'Đã khóa'">Đang hoạt động</span>
                    </div>
                    <dl class="admin-detail-list">
                        <div>
                            <dt>Email</dt>
                            <dd th:text="${managedUser.email}">example@gmail.com</dd>
                        </div>
                        <div>
                            <dt>Vai trò</dt>
                            <dd>
                                <span class="admin-badge" th:classappend="${managedUser.admin()} ? ' is-admin'"
                                      th:text="${managedUser.admin()} ? 'Admin' : 'User'">User</span>
                            </dd>
                        </div>
                        <div>
                            <dt>Ngày tạo</dt>
                            <dd th:text="${managedUser.createdAt}">2026-08-17</dd>
                        </div>
                    </dl>

                    <form th:action="@{/admin/users/{id}/status(id=${managedUser.id})}" method="post"
                          th:if="${!managedUser.admin()}"
                          th:attr="data-confirm=${managedUser.enabled()} ? 'Khóa tài khoản này?' : 'Mở khóa tài khoản này?'">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <input type="hidden" name="enabled" th:value="${!managedUser.enabled()}">
                        <button class="btn" th:classappend="${managedUser.enabled()} ? ' btn-outline-danger' : ' btn-primary'"
                                type="submit"
                                th:text="${managedUser.enabled()} ? 'Khóa tài khoản' : 'Mở khóa tài khoản'">Khóa tài khoản</button>
                    </form>
                    <p class="admin-note" th:if="${managedUser.admin()}">Tài khoản admin không được khóa từ màn hình này.</p>
                </div>

                <div class="admin-panel">
                    <div class="admin-panel-head">
                        <h2>Hoạt động học tập</h2>
                    </div>
                    <section class="admin-stats-grid compact" aria-label="Thống kê người dùng">
                        <div class="admin-stat">
                            <span>Điểm</span>
                            <strong th:text="${managedUser.score}">0</strong>
                        </div>
                        <div class="admin-stat">
                            <span>Thư mục</span>
                            <strong th:text="${managedUser.folderCount}">0</strong>
                        </div>
                        <div class="admin-stat">
                            <span>Bộ</span>
                            <strong th:text="${managedUser.setCount}">0</strong>
                        </div>
                        <div class="admin-stat">
                            <span>Thẻ</span>
                            <strong th:text="${managedUser.cardCount}">0</strong>
                        </div>
                    </section>
                </div>
            </section>
        </main>
    </div>
</div>

<div th:replace="~{fragments/shell :: folderModal}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
