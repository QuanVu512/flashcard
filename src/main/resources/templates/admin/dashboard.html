<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Quản trị | Flashcard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{/css/app.css}" rel="stylesheet">
</head>
<body class="app-body">
<div class="app-shell">
    <div th:replace="~{fragments/shell :: sidebar('admin')}"></div>
    <div class="workspace">
        <div th:replace="~{fragments/shell :: topbar}"></div>

        <main class="content admin-content">
            <div class="content-heading">
                <div>
                    <h1>Bảng quản trị</h1>
                    <p>Theo dõi người dùng, điểm học tập và trạng thái tài khoản.</p>
                </div>
            </div>

            <div class="alert alert-success" th:if="${adminMessage}" th:text="${adminMessage}"></div>
            <div class="alert alert-danger" th:if="${adminError}" th:text="${adminError}"></div>

            <section class="admin-stats-grid" aria-label="Thống kê hệ thống">
                <div class="admin-stat">
                    <span>Người dùng</span>
                    <strong th:text="${stats.userCount}">0</strong>
                </div>
                <div class="admin-stat">
                    <span>Thư mục</span>
                    <strong th:text="${stats.folderCount}">0</strong>
                </div>
                <div class="admin-stat">
                    <span>Bộ flashcard</span>
                    <strong th:text="${stats.setCount}">0</strong>
                </div>
                <div class="admin-stat">
                    <span>Thẻ học</span>
                    <strong th:text="${stats.cardCount}">0</strong>
                </div>
                <div class="admin-stat">
                    <span>Tổng điểm</span>
                    <strong th:text="${stats.totalScore}">0</strong>
                </div>
            </section>

            <section class="admin-panel">
                <div class="admin-panel-head">
                    <h2>Tài khoản</h2>
                    <span th:text="|${#lists.size(users)} người dùng|">0 người dùng</span>
                </div>

                <div class="admin-table-wrap">
                    <table class="admin-table">
                        <thead>
                        <tr>
                            <th>Người dùng</th>
                            <th>Vai trò</th>
                            <th>Trạng thái</th>
                            <th>Điểm</th>
                            <th></th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="user : ${users}">
                            <td>
                                <strong th:text="${user.displayName}">Người dùng</strong>
                                <span th:text="${user.email}">example@gmail.com</span>
                            </td>
                            <td>
                                <span class="admin-badge" th:classappend="${user.admin()} ? ' is-admin'" th:text="${user.admin()} ? 'Admin' : 'User'">User</span>
                            </td>
                            <td>
                                <span class="admin-status" th:classappend="${user.enabled()} ? ' is-active' : ' is-locked'"
                                      th:text="${user.enabled()} ? 'Đang hoạt động' : 'Đã khóa'">Đang hoạt động</span>
                            </td>
                            <td th:text="${user.score}">0</td>
                            <td class="text-end">
                                <a class="btn btn-light btn-sm" th:href="@{/admin/users/{id}(id=${user.id})}">
                                    Chi tiết
                                </a>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>
</div>

<div th:replace="~{fragments/shell :: folderModal}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
