<div class="library-head"><div><button class="breadcrumb-lite" type="button" data-nav="/library"><i class="bi bi-arrow-left"></i> Thư viện</button><h1 data-form-title></h1></div></div>
<form class="set-form" data-set-form novalidate>
    <section class="form-card">
        <div class="row g-3">
            <div class="col-lg-7"><label class="form-label" for="setTitle">Tên bộ flashcard</label><input id="setTitle" class="form-control" name="title" placeholder="Nhập tên bộ flashcard" maxlength="180" required></div>
            <div class="col-lg-5"><label class="form-label" for="folderId">Thư mục</label><select id="folderId" class="form-select" name="folderId"><option value="">Không chọn thư mục</option></select></div>
            <div class="col-12"><label class="form-label" for="description">Mô tả</label><textarea id="description" class="form-control" name="description" rows="3" maxlength="600" placeholder="Nhập ghi chú ngắn cho bộ này"></textarea></div>
        </div>
    </section>
    <div class="library-head compact"><h2>Flashcards</h2><button class="btn btn-light" type="button" data-add-card><i class="bi bi-plus-lg"></i> Thêm thẻ</button></div>
    <div data-card-list aria-live="polite"></div>
    <div class="sticky-actions"><div class="field-error" data-form-error hidden></div><button class="btn btn-light" type="button" data-cancel-set>Hủy</button><button class="btn btn-primary" type="submit">Lưu</button></div>
</form>
