<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${formMode == 'edit' ? 'Sửa bộ flashcard' : 'Tạo bộ flashcard'} + ' | Flashcard'">Tạo bộ | Flashcard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{/css/app.css}" rel="stylesheet">
</head>
<body class="app-body">
<div class="app-shell">
    <div th:replace="~{fragments/shell :: sidebar('library')}"></div>
    <div class="workspace">
        <div th:replace="~{fragments/shell :: topbar}"></div>

        <main class="content">
            <div class="content-heading compact-heading">
                <div>
                    <a class="back-link" th:href="@{/library}">
                        <i class="bi bi-arrow-left"></i>
                        Thư viện
                    </a>
                    <h1 th:text="${formMode == 'edit' ? 'Sửa bộ flashcard' : 'Tạo bộ flashcard'}">Tạo bộ flashcard</h1>
                </div>
            </div>

            <form class="set-form" th:action="${formAction}" th:object="${flashcardSetForm}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                <section class="form-band">
                    <div class="row g-3">
                        <div class="col-lg-7">
                            <label class="form-label" for="title">Tên bộ flashcard</label>
                            <input class="form-control title-input" id="title" th:field="*{title}"
                                   placeholder="Nhập tên bộ flashcard" required>
                            <div class="field-error" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></div>
                        </div>
                        <div class="col-lg-5">
                            <label class="form-label" for="folderId">Thư mục</label>
                            <select class="form-select" id="folderId" th:field="*{folderId}">
                                <option value="">Không chọn thư mục</option>
                                <option th:each="folder : ${folders}" th:value="${folder.id}" th:text="${folder.name}">Folder</option>
                            </select>
                        </div>
                        <div class="col-12">
                            <label class="form-label" for="description">Mô tả</label>
                            <textarea class="form-control" id="description" th:field="*{description}" rows="3"
                                      placeholder="Nhập ghi chú ngắn cho bộ này"></textarea>
                            <div class="field-error" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></div>
                        </div>
                    </div>
                </section>

                <div class="form-error-list" th:if="${#fields.hasGlobalErrors()}">
                    <div th:each="error : ${#fields.globalErrors()}" th:text="${error.defaultMessage}">Lỗi</div>
                </div>

                <section class="term-builder">
                    <div class="term-builder-head">
                        <h2>Flashcards</h2>
                        <button class="btn btn-light" type="button" data-add-card>
                            <i class="bi bi-plus-lg"></i>
                            Thêm thẻ
                        </button>
                    </div>

                    <div id="cardRows" class="card-rows">
                        <div class="term-row" th:each="card, stat : *{cards}" data-card-row>
                            <div class="term-number" th:text="${stat.index + 1}">1</div>
                            <div class="term-fields">
                                <div>
                                    <label class="form-label" th:for="|card-term-${stat.index}|">Từ vựng</label>
                                    <input class="form-control" th:id="|card-term-${stat.index}|"
                                           th:field="*{cards[__${stat.index}__].term}" placeholder="Nhập từ vựng">
                                </div>
                                <div>
                                    <label class="form-label" th:for="|card-definition-${stat.index}|">Nghĩa</label>
                                    <input class="form-control" th:id="|card-definition-${stat.index}|"
                                           th:field="*{cards[__${stat.index}__].definition}" placeholder="Nhập nghĩa">
                                </div>
                                <div>
                                    <label class="form-label" th:for="|card-example-${stat.index}|">Ví dụ</label>
                                    <input class="form-control" th:id="|card-example-${stat.index}|"
                                           th:field="*{cards[__${stat.index}__].example}" placeholder="Nhập ví dụ nếu có">
                                </div>
                            </div>
                            <button class="icon-button remove-row" type="button" data-remove-card aria-label="Xóa thẻ">
                                <i class="bi bi-trash3"></i>
                            </button>
                        </div>
                    </div>
                </section>

                <div class="sticky-submit">
                    <a class="btn btn-light" th:href="@{/library}">Hủy</a>
                    <button class="btn btn-primary" type="submit" th:text="${submitLabel}">Tạo bộ flashcard</button>
                </div>
            </form>
        </main>
    </div>
</div>

<div th:replace="~{fragments/shell :: folderModal}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
