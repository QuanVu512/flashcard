<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${set.title} + ' | Flashcard'">Học flashcard | Flashcard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{/css/app.css}" rel="stylesheet">
</head>
<body class="app-body">
<div class="app-shell">
    <div th:replace="~{fragments/shell :: sidebar('library')}"></div>
    <div class="workspace">
        <div th:replace="~{fragments/shell :: topbar}"></div>

        <main class="content study-content">
            <div class="content-heading">
                <div>
                    <a class="back-link" th:if="${set.folder == null}" th:href="@{/library}">
                        <i class="bi bi-arrow-left"></i>
                        Thư viện
                    </a>
                    <a class="back-link" th:if="${set.folder != null}" th:href="@{/folders/{id}(id=${set.folder.id})}">
                        <i class="bi bi-arrow-left"></i>
                        <span th:text="${set.folder.name}">Thư mục</span>
                    </a>
                    <h1 th:text="${set.title}">Bộ flashcard</h1>
                    <p th:if="${set.description != null}" th:text="${set.description}">Mô tả</p>
                </div>
                <div class="heading-actions">
                    <a class="btn btn-light" th:href="@{/sets/{id}/edit(id=${set.id})}">
                        <i class="bi bi-pencil-square"></i>
                        Sửa
                    </a>
                    <form th:action="@{/sets/{id}/delete(id=${set.id})}" method="post" data-confirm="Xóa bộ flashcard này?">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <button class="btn btn-outline-danger" type="submit">
                            <i class="bi bi-trash3"></i>
                            Xóa
                        </button>
                    </form>
                </div>
            </div>

            <nav class="study-mode-tabs" aria-label="Chế độ học">
                <a class="active" th:href="@{/sets/{id}(id=${set.id})}">
                    <i class="bi bi-stickies-fill"></i>
                    Flashcards
                </a>
                <a th:href="@{/sets/{id}/learn(id=${set.id})}">
                    <i class="bi bi-record-circle"></i>
                    Learn
                </a>
                <a th:href="@{/sets/{id}/test/setup(id=${set.id})}">
                    <i class="bi bi-clipboard-check-fill"></i>
                    Test
                </a>
                <a th:href="@{/sets/{id}/flip(id=${set.id})}">
                    <i class="bi bi-grid-3x3-gap-fill"></i>
                    Lật thẻ
                </a>
            </nav>

            <section class="study-panel">
                <div class="study-progress">
                    <span data-card-counter>1 / 1</span>
                    <div class="progress-track">
                        <div class="progress-fill" data-progress-fill></div>
                    </div>
                </div>

                <button class="flashcard-stage" type="button" data-study-stage aria-label="Lật flashcard">
                    <span class="flip-hint">Nhấn để lật thẻ</span>
                    <span class="flashcard-face flashcard-front">
                        <span class="face-label">Từ vựng</span>
                        <strong data-card-term>Term</strong>
                    </span>
                    <span class="flashcard-face flashcard-back">
                        <span class="face-label">Nghĩa</span>
                        <strong data-card-definition>Definition</strong>
                        <small data-card-example-wrap>
                            <i class="bi bi-chat-left-quote"></i>
                            <span data-card-example>Example</span>
                        </small>
                    </span>
                </button>

                <div class="study-controls">
                    <button class="round-action" type="button" data-prev-card aria-label="Thẻ trước">
                        <i class="bi bi-chevron-left"></i>
                    </button>
                    <button class="btn btn-primary" type="button" data-flip-card>
                        <i class="bi bi-arrow-repeat"></i>
                        Lật thẻ
                    </button>
                    <button class="round-action" type="button" data-next-card aria-label="Thẻ sau">
                        <i class="bi bi-chevron-right"></i>
                    </button>
                    <button class="btn btn-light" type="button" data-shuffle-cards>
                        <i class="bi bi-shuffle"></i>
                        Đảo thứ tự
                    </button>
                </div>
            </section>
        </main>
    </div>
</div>

<div th:replace="~{fragments/shell :: folderModal}"></div>
<script th:inline="javascript">
    window.studyCards = /*[[${studyCards}]]*/ [];
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
