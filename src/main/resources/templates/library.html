<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${pageTitle} + ' | Flashcard'">Thư viện | Flashcard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{/css/app.css}" rel="stylesheet">
</head>
<body class="app-body">
<div class="app-shell">
    <div th:replace="~{fragments/shell :: sidebar('library')}"></div>
    <div class="workspace">
        <div th:replace="~{fragments/shell :: topbar}"></div>

        <main class="content">
            <div class="content-heading">
                <div>
                    <h1 th:text="${pageTitle}">Thư viện của bạn</h1>
                    <p th:if="${currentFolder != null}" th:text="${currentFolder.description}">Ghi chú thư mục</p>
                </div>
                <a th:if="${currentFolder == null}" class="btn btn-primary" th:href="@{/sets/new}">
                    <i class="bi bi-plus-lg"></i>
                    Tạo bộ flashcard
                </a>
                <a th:if="${currentFolder != null}" class="btn btn-primary"
                   th:href="@{/sets/new(folderId=${currentFolder.id})}">
                    <i class="bi bi-plus-lg"></i>
                    Tạo trong thư mục
                </a>
            </div>

            <div class="pill-tabs" aria-label="Loại nội dung">
                <a class="active" th:href="@{/library}">Bộ flashcard</a>
                <a href="#folders-panel">Thư mục</a>
            </div>

            <div class="library-toolbar">
                <button class="soft-pill" type="button">
                    Gần đây
                    <i class="bi bi-chevron-down"></i>
                </button>
                <form class="library-search" th:action="@{/library}" method="get" role="search">
                    <input type="search" name="q" th:value="${keyword}" placeholder="Tìm kiếm flashcard">
                    <button type="submit" aria-label="Tìm kiếm">
                        <i class="bi bi-search"></i>
                    </button>
                </form>
            </div>

            <div class="alert alert-success" th:if="${folderCreated}" th:text="|Đã tạo thư mục ${folderCreated}|"></div>
            <div class="alert alert-danger" th:if="${folderError}" th:text="${folderError}"></div>
            <div class="alert alert-success" th:if="${setDeleted}">Đã xóa bộ flashcard.</div>

            <section class="empty-state" th:if="${groupedSets.isEmpty()}">
                <div class="empty-icon"><i class="bi bi-layers"></i></div>
                <h2>Chưa có bộ flashcard nào</h2>
                <p>Bắt đầu bằng một bộ từ vựng nhỏ cho chương học hiện tại.</p>
                <a class="btn btn-primary" th:href="@{/sets/new}">Tạo bộ đầu tiên</a>
            </section>

            <section class="library-group" th:each="group : ${groupedSets}">
                <div class="group-title">
                    <span th:text="${group.key}">GẦN ĐÂY</span>
                </div>

                <a class="set-card" th:each="set : ${group.value}"
                   th:href="@{/sets/{id}(id=${set.id})}"
                   th:attr="data-search-text=${set.title}">
                    <div class="set-card-main">
                        <div class="set-meta">
                            <strong th:text="|${#lists.size(set.cards)} thuật ngữ|">26 thuật ngữ</strong>
                            <span class="dot-divider"></span>
                            <span class="avatar-mini" th:text="${#strings.substring(client.displayName, 0, 1)}">U</span>
                            <span th:text="${client.displayName}">Bạn</span>
                            <span class="folder-pill" th:if="${set.folder != null}" th:text="${set.folder.name}">Folder</span>
                        </div>
                        <h2 th:text="${set.title}">Mental and Physical Development</h2>
                        <p th:if="${set.description != null}" th:text="${set.description}">Mô tả</p>
                    </div>
                    <i class="bi bi-chevron-right"></i>
                </a>
            </section>
        </main>
    </div>
</div>

<div th:replace="~{fragments/shell :: folderModal}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
